Parameters:
  InputBucketName:
    Type: String
    Description: Please enter in your desired bucket name
    

Resources:
  MyS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref InputBucketName
      Tags:
        - Key: Developer
          Value: "Ben Z"
        - Key: Envirionment
          Value: "Development"

    Metadata:
      Purpose: "Creating a S3 bucket"
      Reviewed: "07-17-2026"
      Owner: "John Smith"
      Contact: "Johnsmith@gmail.com"
      