Parameters:
  InputBucketName:
    Type: String
    Description: Please enter in your desired bucket name
  InputDeveloperName:
    Type: String
    Description: Please enter in your name
    Default: 'Ben Z'
  TestTagInput:
    Type: String
    Description: Test tag for allowed values
    Default: AllowedValueHere

Resources:
  MyS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref InputBucketName
      Tags:
        - Key: Developer
          Value: !Ref InputDeveloperName
        - Key: Envirionment
          Value: "Development"
        - Key: TestTag
          Value: !Ref TestTagInput
    Metadata:
      Purpose: "Creating a S3 bucket"
      Reviewed: "07-17-2026"
      Owner: "John Smith"
      Contact: "Johnsmith@gmail.com"
      